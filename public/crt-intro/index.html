<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sahil Wadhwa CRT Intro</title><style>*{box-sizing:border-box}html,body,#stage{margin:0;width:100%;height:100%;overflow:hidden}#stage{display:grid;place-items:center;align-content:center;gap:22px;background:radial-gradient(#faf7ed,#d5d0c4)}#tv{position:relative;width:min(96vw,1500px);aspect-ratio:1672/941;filter:drop-shadow(0 28px 24px #0006)}#screen{position:absolute;left:11.5%;top:12.3%;width:63%;height:73.5%;z-index:1;border-radius:11% 8% 10% 9%;background:#080908;overflow:hidden}#frame{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}#power{position:absolute;z-index:3;left:85.1%;top:79.5%;width:4.1%;aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 35% 35%,#ff7657 0 10%,#6a180e 23%,#160c09 60%,#a77739 62%,#21130c 72%);box-shadow:0 0 0 2px #0008,0 0 14px #ff4a2788}#power:hover{box-shadow:0 0 0 2px #0008,0 0 22px 6px #ff4a2799}#power:active{transform:scale(.88)}#power:after{content:'POWER';position:absolute;top:130%;left:50%;transform:translateX(-50%);font:600 8px monospace;color:#eee;text-shadow:0 1px #000}#hint{margin:0;font:600 14px monospace;letter-spacing:.1em;color:#36332c;text-transform:uppercase}@media(max-width:600px){#hint{font-size:10px}}</style></head><body><main id="stage"><div id="tv"><canvas id="screen"></canvas><img id="frame" src="vintage-tv-frame.png" alt="Vintage TV"><button id="power" aria-label="Turn on television"></button></div><p id="hint">Click the power button to turn on the TV</p></main><audio id="sound" src="freesound_community-068253_tv-no-signal-sound-effect-39454.mp3.mpeg"></audio><script>
(()=>{const c=document.querySelector('#screen'),g=c.getContext('2d'),btn=document.querySelector('#power'),sound=document.querySelector('#sound'),files=['default.png','click.png','help.png','hover.png','loading.png','not allowed.png','precision.png','status.png','text.png'],faces=files.map(s=>Object.assign(new Image,{src:s}));let start=0,raf,on=false;const D=5900,r=(a,b)=>a+Math.random()*(b-a);function fit(){let b=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=b.width*d;c.height=b.height*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',fit);function static(w,h,a){g.save();for(let i=0;i<w*h/26;i++){g.globalAlpha=r(.04,.25)*a;g.fillStyle=Math.random()>.5?'#fff':'#122';g.fillRect(Math.random()*w,Math.random()*h,r(1,8),1)}g.fillStyle=`rgba(0,0,0,${a*.13})`;for(let y=0;y<h;y+=3)g.fillRect(0,y,w,1);g.restore()}function pic(im,X,Y,S,rot,op=1){if(!im.naturalWidth)return;let H=S*im.height/im.width;g.save();g.translate(X,Y);g.rotate(rot);g.globalAlpha=op;g.drawImage(im,-S/2,-H/2,S,H);g.restore()}function blast(w,h,q){let p=Math.max(0,1-Math.abs(q-.5)*3);if(!p)return;let cx=w/2,cy=h/2;g.save();g.translate(cx,cy);g.globalCompositeOperation='screen';let rad=Math.min(w,h)*(.08+q*.34),gr=g.createRadialGradient(0,0,0,0,0,rad);gr.addColorStop(0,'#fffbe0');gr.addColorStop(.16,'#ffd52e');gr.addColorStop(.44,'rgba(242,72,8,.78)');gr.addColorStop(1,'rgba(40,20,12,0)');g.globalAlpha=p;g.fillStyle=gr;g.beginPath();g.arc(0,0,rad,0,7);g.fill();for(let i=0;i<50;i++){let z=i*2.399+q,len=(.15+q*.8)*Math.max(w,h);g.globalAlpha=p*r(.15,.62);g.strokeStyle=i%3?'#ffb021':'#41190d';g.lineWidth=Math.max(1,7*(1-q));g.beginPath();g.moveTo(Math.cos(z)*len*.08,Math.sin(z)*len*.08);g.lineTo(Math.cos(z)*len,Math.sin(z)*len);g.stroke()}g.restore()}function name(w,h,t){let j=Math.sin(t*.035)*5;g.save();g.textAlign='center';g.font=`900 ${Math.min(w*.125,88)}px Impact,Arial Black,sans-serif`;g.globalCompositeOperation='screen';g.fillStyle='#f5f2df';g.fillText('SAHIL WADHWA',w/2+j,h*.52);g.fillStyle='rgba(255,30,20,.45)';g.fillText('SAHIL WADHWA',w/2+j+3,h*.52);g.fillStyle='rgba(0,180,255,.45)';g.fillText('SAHIL WADHWA',w/2+j-3,h*.52);g.globalCompositeOperation='source-over';g.restore()}function draw(now){if(!on)return;let t=Math.min(now-start,D),w=c.clientWidth,h=c.clientHeight,cx=w/2,cy=h/2;g.clearRect(0,0,w,h);if(t<700){let q=t/700;g.fillStyle='#050605';g.fillRect(0,0,w,h);g.fillStyle='#e8f0e5';g.fillRect(0,cy-h*q*q/2,w,Math.max(2,h*q*q))}else if(t<1800){g.fillStyle='#c3c9be';g.fillRect(0,0,w,h);static(w,h,.9);g.textAlign='center';g.fillStyle='#172017';g.font=`700 ${Math.min(w*.09,62)}px monospace`;g.fillText('NO SIGNAL',cx,cy);g.font='12px monospace';g.fillText('PLEASE CHECK INPUT',cx,cy+42)}else if(t<4100){g.fillStyle='#c3c9be';g.fillRect(0,0,w,h);static(w,h,.8);let q=(t-1800)/2300,n=5+Math.floor(q*30);for(let k=0;k<n;k++){let S=Math.min(w,h)*(.12+(k%5)*.022),up=k%3==0,Y=up?h-(((t-1800)*(.12+(k%6)*.045)+k*79)%(h+2*S))+S:(((t-1800)*(.12+(k%6)*.045)+k*79)%(h+2*S))-S,X=w*((k%8+.5)/8)+Math.sin(t*.004+k)*w*.07;pic(faces[k%faces.length],X,Y,S,Math.sin(t*.003+k)*.13)}}else if(t<4900){let q=(t-4100)/800,e=1-(1-q)**4;g.fillStyle='#c3c9be';g.fillRect(0,0,w,h);static(w,h,.6);for(let k=0;k<38;k++){let z=k*2.399,d=(1-e)*Math.max(w,h)*.8;pic(faces[k%faces.length],cx+Math.cos(z)*d,cy+Math.sin(z)*d,Math.min(w,h)*(.14+(k%5)*.024),z*.12,.9)}blast(w,h,q);if(q>.14&&q<.34){g.fillStyle=`rgba(255,225,185,${1-Math.abs(q-.24)*10})`;g.fillRect(0,0,w,h)}}else{g.fillStyle='#bfc5ba';g.fillRect(0,0,w,h);static(w,h,.85);name(w,h,t);if(t>5550){g.fillStyle=`rgba(0,0,0,${(t-5550)/350})`;g.fillRect(0,0,w,h)}}if(t>700&&t<5550)static(w,h,.16);if(t<D)raf=requestAnimationFrame(draw);else on=false}window.CRTIntro={play(){fit();start=performance.now();on=true;sound.currentTime=0;sound.volume=.18;sound.play().catch(()=>{});raf=requestAnimationFrame(draw)}};btn.onclick=()=>window.CRTIntro.play();fit()})();
</script><script>
/* A separate in-screen title layer keeps the final black lettering legible over static. */
(()=>{const tv=document.querySelector('#tv'),power=document.querySelector('#power'),title=document.createElement('div');title.textContent='SAHIL WADHWA';Object.assign(title.style,{position:'absolute',left:'11.5%',top:'12.3%',width:'63%',height:'73.5%',zIndex:'1',display:'none',alignItems:'center',justifyContent:'center',pointerEvents:'none',color:'#5b4831',fontFamily:'Impact, Arial Black, sans-serif',fontWeight:'900',fontSize:'clamp(22px,5vw,82px)',whiteSpace:'nowrap',letterSpacing:'.025em',animation:'crt-title-jitter .12s steps(2) infinite'});tv.appendChild(title);const style=document.createElement('style');style.textContent='@keyframes crt-title-jitter{0%{transform:translate(0,0)}50%{transform:translate(2px,-1px)}100%{transform:translate(-1px,1px)}}';document.head.appendChild(style);let showTimer,hideTimer;power.addEventListener('click',()=>{clearTimeout(showTimer);clearTimeout(hideTimer);title.style.display='none';showTimer=setTimeout(()=>title.style.display='flex',4900);hideTimer=setTimeout(()=>title.style.display='none',5700)})})();
</script><script>
/* Keep the final title restrained: monochrome phosphor, not RGB neon. */
(()=>{const nativeFillText=CanvasRenderingContext2D.prototype.fillText;CanvasRenderingContext2D.prototype.fillText=function(text,...args){if(text==='SAHIL WADHWA')return;return nativeFillText.call(this,text,...args)}})();
</script><script>
/* The enter lamp lives inside the TV, over the existing red pilot-light recess. */
(()=>{const tv=document.querySelector('#tv'),power=document.querySelector('#power'),lamp=document.createElement('button');lamp.id='enter-lamp';lamp.type='button';lamp.setAttribute('aria-label','Enter site');tv.appendChild(lamp);const s=document.createElement('style');s.textContent='#enter-lamp{position:absolute;z-index:4;left:81.5%;top:81.5%;width:2.45%;aspect-ratio:1;border:2px solid #17160f;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#473e22 0 12%,#211f13 42%,#090a07 74%);box-shadow:0 0 0 2px rgba(185,137,76,.65);cursor:default;pointer-events:none;transition:background .3s,box-shadow .3s}#enter-lamp:after{content:"ENTER SITE";position:absolute;top:135%;left:50%;transform:translateX(-50%);white-space:nowrap;color:transparent;font:700 7px/1 monospace;letter-spacing:.04em;text-shadow:none;transition:color .3s}#enter-lamp.ready{pointer-events:auto;cursor:pointer;background:radial-gradient(circle at 35% 28%,#f1ff9a 0 10%,#a9f13a 27%,#3e7d0b 60%,#132305 78%);box-shadow:0 0 0 2px rgba(185,137,76,.65),0 0 14px 5px rgba(174,255,53,.82);animation:enterLamp 1.3s ease-in-out infinite alternate}#enter-lamp.ready:after{color:#f2ead8;text-shadow:0 1px 1px #000}@keyframes enterLamp{to{box-shadow:0 0 0 2px rgba(185,137,76,.65),0 0 25px 9px rgba(174,255,53,.95)}}';document.head.appendChild(s);let timer;power.addEventListener('click',()=>{lamp.classList.remove('ready');clearTimeout(timer);timer=setTimeout(()=>lamp.classList.add('ready'),5900)});lamp.addEventListener('click',()=>parent.postMessage('crt-enter-site','*'))})();
</script></body></html>
